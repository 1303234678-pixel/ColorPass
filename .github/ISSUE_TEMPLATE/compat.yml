name: 版本不兼容
description: 剪映或达芬奇升级后失效，或换了平台（macOS / 旧版达芬奇）
title: "[compat] "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        剪映的明文路线依赖它内部行为，升级后失效是可预期的；达芬奇的脚本 API
        也会在版本间增删。**先跑一次下面的命令**，它把「哪一步不成立、缺哪个方法」
        一次说清，比贴截图有用得多：

        ```bash
        colorpass compat     # 一句话结论 + 缺项影响
        colorpass doctor     # 全量快照
        ```

        不想开终端也可以：面板页脚点「诊断」，把框里的文字全选复制。
        输出只有系统、版本、路径与 API 有无，不含素材内容与草稿正文。

  - type: textarea
    id: doctor
    attributes:
      label: colorpass compat / doctor 输出
      description: 整段粘贴即可；doctor 嫌长可用 `--compact` 出单行 JSON
      render: text
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 系统
      options:
        - Windows 10 / 11
        - macOS（Apple Silicon）
        - macOS（Intel）
        - Linux
    validations:
      required: true

  - type: input
    id: jianying
    attributes:
      label: 剪映版本（升级前 → 升级后）
      placeholder: 11.7.0 → 12.0.1
    validations:
      required: false

  - type: input
    id: resolve
    attributes:
      label: 达芬奇版本（若 doctor 里没带出来）
      placeholder: 18.6.6 / 19.1.3 / 20.0.1
    validations:
      required: false

  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 例如「check 报 no_plaintext」「送入后段数不对」「写回后剪映打不开」「mac 上认不出当前草稿」
    validations:
      required: true

  - type: textarea
    id: check
    attributes:
      label: colorpass check 输出（可选）
      render: json
    validations:
      required: false
