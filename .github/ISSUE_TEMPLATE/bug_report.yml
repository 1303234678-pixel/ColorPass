name: Bug 报告
description: 送入 / 取色 / 写回 出问题时用这个
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先跑一次 `jybridge check`，把输出贴上来 —— 它包含判断问题所需的大部分信息
        （草稿结构、明文来源、新鲜度）。**不要上传真实草稿或素材**，贴 JSON 就够了。

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 点的是哪个按钮 / 哪条命令，期望什么，实际什么。
      placeholder: 点「送入达芬奇」后，面板停在「执行中」，达芬奇没有新建时间线。
    validations:
      required: true

  - type: textarea
    id: check
    attributes:
      label: jybridge check 输出
      description: 终端运行 `jybridge check`，把整段 JSON 贴进来。
      render: json
    validations:
      required: true

  - type: input
    id: jianying
    attributes:
      label: 剪映版本
      description: 剪映专业版 → 设置 → 关于。例如 11.7.0
    validations:
      required: true

  - type: input
    id: resolve
    attributes:
      label: 达芬奇版本
      description: DaVinci Resolve → 关于。例如 20.1.1
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的环节
      options:
        - 读草稿（check / 面板扫不到草稿）
        - 送入达芬奇（位置错、缺失、变速）
        - 取回调色（LUT 不对 / 缺段）
        - 写回剪映（写不进去 / 写进去少东西）
        - 安装与启动（面板打不开）
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        `%LOCALAPPDATA%\JYBridge\jybridge.log` 与 `panel\jybridge_panel.log` 的最后 50 行。
        报告文件在 `%LOCALAPPDATA%\JYBridge\runs\<草稿ID>\`（send.json / plan.json 等）。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 已确认草稿是打开的，且 `jybridge check` 能读到（不是 no_plaintext）
          required: true
        - label: 已尝试「关掉草稿再重新打开」一次
          required: false
